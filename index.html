<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarau</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="slideshow">

        <img id="slide" src="fotos/foto1.jpg" alt="Foto do Sarau">

    </div>

    <div id="startScreen">

        <h1>🎭 SARAU</h1>

        <p>
            Pressione <strong>ENTER</strong> para iniciar
        </p>

        <p class="info">
            1 = Música 1 &nbsp; | &nbsp;
            2 = Música 2 &nbsp; | &nbsp;
            3 = Música 3
        </p>

    </div>

    <div id="musicInfo">
        🎵 Nenhuma música selecionada
    </div>

    <audio id="audio1" src="musicas/musica1.mp3" loop></audio>

    <audio id="audio2" src="musicas/musica2.mp3" loop></audio>

    <audio id="audio3" src="musicas/musica3.mp3" loop></audio>

    <script src="script.js"></script>

</body>

</html>
